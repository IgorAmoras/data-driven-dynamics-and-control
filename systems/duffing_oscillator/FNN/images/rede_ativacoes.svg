<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 263" width="680" height="263" role="img"><title>Rede de dois neurônios para comparação de ativações</title><rect width="680" height="263" rx="12" fill="#fff"/><g font-family="Arial, sans-serif" fill="#172033" font-size="13"><text x="340" y="26" text-anchor="middle" font-size="18" font-weight="bold">f(x) = σ(x + 1) − σ(x − 1)</text><line x1="94" y1="125" x2="305" y2="75" stroke="#8793a5" stroke-width="1.8" /><text x="191" y="83" text-anchor="middle" font-size="15">+1</text><line x1="94" y1="125" x2="305" y2="175" stroke="#8793a5" stroke-width="1.8" /><text x="191" y="174" text-anchor="middle" font-size="15">+1</text><line x1="355" y1="75" x2="566" y2="125" stroke="#8793a5" stroke-width="1.8" /><text x="467" y="83" text-anchor="middle" font-size="15">+1</text><line x1="355" y1="175" x2="566" y2="125" stroke="#8793a5" stroke-width="1.8" /><text x="467" y="174" text-anchor="middle" font-size="15">−1</text><circle cx="70" cy="125" r="24" stroke="#2563eb" stroke-width="1.8" fill="#f3f5fa"/><text x="70" y="131" text-anchor="middle" font-size="22">x</text><circle cx="330" cy="75" r="25" stroke="#7c3aed" stroke-width="1.8" fill="#f3f5fa"/><text x="330" y="81" text-anchor="middle" font-size="22">σ</text><circle cx="330" cy="175" r="25" stroke="#7c3aed" stroke-width="1.8" fill="#f3f5fa"/><text x="330" y="181" text-anchor="middle" font-size="22">σ</text><circle cx="590" cy="125" r="24" stroke="#15803d" stroke-width="1.8" fill="#f3f5fa"/><text x="590" y="131" text-anchor="middle" font-size="22">Σ</text><text x="330" y="43" text-anchor="middle">b = +1</text><text x="330" y="215" text-anchor="middle">b = −1</text><text x="590" y="164" text-anchor="middle">Saída linear</text><text x="340" y="247" text-anchor="middle" fill="#526176">Dois neurônios ocultos, parâmetros fixos e viés de saída nulo.</text></g></svg>
