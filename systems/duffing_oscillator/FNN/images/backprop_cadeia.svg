<svg xmlns="http://www.w3.org/2000/svg" width="700" height="254" viewBox="0 0 700 254" role="img"><title>Reutilização das sensibilidades</title><rect width="700" height="254" rx="12" fill="#fff"/><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#15803d"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b45309"/></marker></defs><g font-family="Arial, sans-serif" fill="#172033" font-size="15"><text x="350" y="28" text-anchor="middle" font-size="19" font-weight="bold">Regra da cadeia reutilizada</text><rect x="390" y="52" width="260" height="48" rx="8" fill="#f3f5fa" stroke="#b45309" stroke-width="1.6"/><text x="520" y="81" text-anchor="middle" >δ₂ = (ŷ − y) σ₂′(a₂)</text><rect x="50" y="52" width="260" height="48" rx="8" fill="#f3f5fa" stroke="#b45309" stroke-width="1.6"/><text x="180" y="81" text-anchor="middle" >δ₁ = δ₂ w₂ σ₁′(a₁)</text><line x1="388" y1="76" x2="312" y2="76" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/><text x="350" y="49" text-anchor="middle" font-size="13" fill="#b45309">δ₂ é reutilizado</text><line x1="180" y1="101" x2="180" y2="139" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/><line x1="520" y1="101" x2="520" y2="139" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/><rect x="50" y="142.5" width="260" height="45" rx="8" fill="#f3f5fa" stroke="#15803d" stroke-width="1.6"/><text x="180" y="170" text-anchor="middle" >∂ℒ/∂w₁ = δ₁ x</text><rect x="390" y="142.5" width="260" height="45" rx="8" fill="#f3f5fa" stroke="#15803d" stroke-width="1.6"/><text x="520" y="170" text-anchor="middle" >∂ℒ/∂w₂ = δ₂ z₁</text><text x="180" y="205" text-anchor="middle" >∂ℒ/∂b₁ = δ₁</text><text x="520" y="205" text-anchor="middle" >∂ℒ/∂b₂ = δ₂</text><text x="350" y="239" text-anchor="middle" fill="#526176" font-size="13">Uma sensibilidade por camada; os gradientes locais reutilizam o resultado.</text></g></svg>
