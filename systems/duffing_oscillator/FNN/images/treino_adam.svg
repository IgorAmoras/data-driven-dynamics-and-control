<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 335" width="700" height="335" role="img"><title>Fluxo de Adam</title><rect width="700" height="335" rx="12" fill="#fff"/><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#526176"/></marker></defs><g font-family="Arial,sans-serif" fill="#172033" font-size="14"><text x="350" y="29" text-anchor="middle" font-size="18" font-weight="bold">Adam: como o gradiente se transforma em atualização</text><rect x="270" y="49" width="160" height="34" rx="7" fill="#f3f5fa" stroke="#2563eb" stroke-width="1.5"/><text x="350" y="71" text-anchor="middle" >Gradiente gₜ</text><line x1="315" y1="84" x2="175" y2="107" stroke="#526176" stroke-width="1.6" marker-end="url(#a)"/><line x1="385" y1="84" x2="525" y2="107" stroke="#526176" stroke-width="1.6" marker-end="url(#a)"/><rect x="35" y="110" width="280" height="40" rx="7" fill="#f3f5fa" stroke="#7c3aed" stroke-width="1.5"/><text x="175" y="135" text-anchor="middle" >mₜ: média do gradiente</text><rect x="385" y="110" width="280" height="40" rx="7" fill="#f3f5fa" stroke="#b45309" stroke-width="1.5"/><text x="525" y="135" text-anchor="middle" >vₜ: média dos quadrados</text><line x1="175" y1="151" x2="175" y2="177" stroke="#526176" stroke-width="1.6" marker-end="url(#a)"/><line x1="525" y1="151" x2="525" y2="177" stroke="#526176" stroke-width="1.6" marker-end="url(#a)"/><rect x="35" y="179" width="280" height="40" rx="7" fill="#f3f5fa" stroke="#7c3aed" stroke-width="1.5"/><text x="175" y="204" text-anchor="middle" >m̂ₜ = mₜ / (1 − β₁ᵗ)</text><rect x="385" y="179" width="280" height="40" rx="7" fill="#f3f5fa" stroke="#b45309" stroke-width="1.5"/><text x="525" y="204" text-anchor="middle" >v̂ₜ = vₜ / (1 − β₂ᵗ)</text><line x1="175" y1="220" x2="300" y2="254" stroke="#526176" stroke-width="1.6" marker-end="url(#a)"/><line x1="525" y1="220" x2="400" y2="254" stroke="#526176" stroke-width="1.6" marker-end="url(#a)"/><rect x="145" y="255" width="410" height="44" rx="7" fill="#f3f5fa" stroke="#15803d" stroke-width="1.5"/><text x="350" y="282" text-anchor="middle" >Δθ = −η m̂ₜ / (√v̂ₜ + ε)</text><text x="350" y="321" text-anchor="middle" font-size="12" fill="#526176">Operações por componente; os momentos preservam informação das iterações anteriores.</text></g></svg>
