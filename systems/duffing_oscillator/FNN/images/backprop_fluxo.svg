<svg xmlns="http://www.w3.org/2000/svg" width="700" height="235" viewBox="0 0 700 235" role="img"><title>Fluxos do backpropagation</title><rect width="700" height="235" rx="12" fill="#fff"/><defs><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#15803d"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b45309"/></marker></defs><g font-family="Arial, sans-serif" fill="#172033" font-size="15"><text x="350" y="28" text-anchor="middle" font-size="19" font-weight="bold">Forward e backward propagation</text><text x="350" y="54" text-anchor="middle" fill="#15803d">Forward: cálculo das ativações e da perda</text><rect x="27.5" y="74" width="95" height="38" rx="8" fill="#f3f5fa" stroke="#2563eb" stroke-width="1.6"/><text x="75" y="98" text-anchor="middle" >ζ</text><rect x="162.5" y="74" width="95" height="38" rx="8" fill="#f3f5fa" stroke="#2563eb" stroke-width="1.6"/><text x="210" y="98" text-anchor="middle" >z₁</text><rect x="297.5" y="74" width="95" height="38" rx="8" fill="#f3f5fa" stroke="#2563eb" stroke-width="1.6"/><text x="345" y="98" text-anchor="middle" >z₂</text><rect x="432.5" y="74" width="95" height="38" rx="8" fill="#f3f5fa" stroke="#2563eb" stroke-width="1.6"/><text x="480" y="98" text-anchor="middle" >z₃ = ŷ</text><rect x="577.5" y="74" width="95" height="38" rx="8" fill="#f3f5fa" stroke="#b45309" stroke-width="1.6"/><text x="625" y="98" text-anchor="middle" >ℒ</text><line x1="124" y1="93" x2="159" y2="93" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/><line x1="259" y1="93" x2="294" y2="93" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/><line x1="394" y1="93" x2="429" y2="93" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/><line x1="529" y1="93" x2="574" y2="93" stroke="#15803d" stroke-width="2" marker-end="url(#g)"/><line x1="625" y1="151" x2="75" y2="151" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/><text x="350" y="139" text-anchor="middle" fill="#b45309">Backward: sensibilidades da perda</text><text x="350" y="178" text-anchor="middle" font-size="14">∇Wᵢ ℒ e ∇bᵢ ℒ calculados a partir das sensibilidades</text><text x="350" y="211" text-anchor="middle" fill="#526176" font-size="13">Atualização dos parâmetros somente após o cálculo dos gradientes.</text></g></svg>
